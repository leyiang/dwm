<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "Segoe UI", sans-serif;
  }
  .card {
    width: 100%; height: 100%;
    padding: 16px 18px;
    border-radius: 20px;
    background: rgba(28, 30, 36, 0.80);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #f4f5f8;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: opacity 220ms ease;
  }
  html.dwmshell-occupied .card { opacity: 0.72; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #7cb8ff;
  }
  .count {
    font-size: 12px;
    color: rgba(244, 245, 248, 0.6);
    font-variant-numeric: tabular-nums;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.06);
    cursor: pointer;
    transition: background 140ms ease;
  }
  .item:hover { background: rgba(255, 255, 255, 0.12); }
  .box {
    width: 16px; height: 16px;
    border-radius: 5px;
    border: 1.5px solid rgba(255, 255, 255, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }
  .item.done .box {
    background: #007cff;
    border-color: #007cff;
  }
  .label {
    font-size: 13px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item.done .label {
    text-decoration: line-through;
    color: rgba(244, 245, 248, 0.45);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="title">TODAY · TASKS</span>
      <span class="count" id="count">0/0</span>
    </div>
    <div class="list" id="list"></div>
  </div>
  <script>
    let items = [];

    function render() {
      const list = document.getElementById('list');
      list.innerHTML = '';
      let done = 0;
      for (const item of items) {
        if (item.done) done++;
        const row = document.createElement('div');
        row.className = 'item' + (item.done ? ' done' : '');
        row.dataset.id = item.id;
        row.innerHTML = `<span class="box">${item.done ? '✓' : ''}</span><span class="label"></span>`;
        row.querySelector('.label').textContent = item.text;
        row.addEventListener('click', async () => {
          item.done = !item.done;
          render();
          await window.dwmshell.saveState({ items });
        });
        list.appendChild(row);
      }
      document.getElementById('count').textContent = `${done}/${items.length}`;
    }

    async function init() {
      const saved = await window.dwmshell.loadState();
      const initial = window.dwmshell.getData();
      if (saved && Array.isArray(saved.items) && saved.items.length > 0) {
        items = saved.items;
      } else if (initial && Array.isArray(initial.items)) {
        items = initial.items.map(x => ({ ...x }));
      }
      render();

      window.dwmshell.onData(async (d) => {
        if (d && Array.isArray(d.items)) {
          items = d.items.map(x => ({ ...x }));
          render();
          await window.dwmshell.saveState({ items });
        }
      });
    }
    init();
  </script>
</body>
</html>
